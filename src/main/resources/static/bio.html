<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio | LinkNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/bio.css">
</head>
<body class="theme-midnight" id="bioBody">
    <div class="bio-container">
        <!-- Profile Header -->
        <header class="bio-header">
            <div class="avatar-wrapper">
                <img id="bioAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Avatar" class="avatar-img">
            </div>
            <h1 id="bioName" class="display-name">Alex Chen</h1>
            <p id="bioHandle" class="username-handle">@alex</p>
            <p id="bioDescription" class="bio-text">Full-Stack Software Engineer • Java, Spring Boot & Cloud Enthusiast 🚀</p>

            <!-- Social Links Icons Row -->
            <div id="socialsRow" class="socials-row">
                <!-- Dynamically injected -->
            </div>
        </header>

        <!-- Links Stack -->
        <main class="links-stack" id="linksContainer">
            <!-- Dynamically populated -->
        </main>

        <!-- Footer -->
        <footer class="bio-footer">
            <a href="/" class="powered-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                Powered by <strong>LinkNest</strong>
            </a>
        </footer>
    </div>

    <script src="/js/bio.js"></script>
</body>
</html>
